<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo T-RPG - Connexion</title>
    <style>
        body { background-color: #1a1e24; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #232830; padding: 20px; border-radius: 8px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #d4af37; }
        input { width: 90%; padding: 10px; margin: 10px 0; background: #15181c; border: 1px solid #333; color: white; }
        button { width: 100%; padding: 10px; margin: 10px 0; border: none; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #d4af37; color: #000; }
        .btn-secondary { background: #333; color: #fff; }
        #log { margin-top: 15px; padding: 10px; background: #000; font-family: monospace; font-size: 12px; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 style="text-align: center; color: #d4af37;">ECHO T-RPG</h2>
        
        <input type="text" id="username" placeholder="Pseudo">
        
        <div id="register-fields" style="display: none;">
            <input type="email" id="email" placeholder="Email">
            <input type="date" id="dob">
        </div>
        
        <input type="password" id="password" placeholder="Mot de passe">
        
        <button id="main-btn" class="btn-primary" onclick="sendAction('login')">SE CONNECTER</button>
        <div style="text-align: center; margin: 10px 0;">OU</div>
        <button id="secondary-btn" class="btn-secondary" onclick="toggleMode()">CRÉER UN COMPTE</button>
        
        <a href="#" id="forgot-link" style="display: block; text-align: center; color: #888; font-size: 12px; margin-top: 10px;">Mot de passe oublié ?</a>

        <div id="log">
            <div style="color: #888;">État : Initialisation...</div>
        </div>
    </div>

    <!-- C'EST ICI QUE L'ON CHARGE TON SCRIPT -->
    <script src="client.js"></script>
</body>
</html>
